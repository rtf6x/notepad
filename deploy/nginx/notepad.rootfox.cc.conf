upstream notepadApp {
    server 127.0.0.1:8901;
}

server {
    server_name notepad.rootfox.cc;

    limit_rate 196K;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 16m;

    large_client_header_buffers 8 32k;
    proxy_buffers 8 32k;
    proxy_buffer_size 64k;
    proxy_read_timeout 120s;
    proxy_connect_timeout 75s;

    location /.git {
        return 403;
    }

    location / {
        proxy_pass http://notepadApp;
        proxy_redirect http://127.0.0.1:8901/ /;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/notepad.rootfox.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/notepad.rootfox.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = notepad.rootfox.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name notepad.rootfox.cc;
    return 404; # managed by Certbot
}
